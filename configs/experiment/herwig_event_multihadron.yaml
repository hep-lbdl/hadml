# @package _global_

# ==================================================================================================
#   To execute this experiment run:
#     $ python src/train.py experiment=herwig_event_multihadron

#   You may also add a logger (e.g. Weight & Biases):
#     $ python src/train.py experiment=herwig_event_multihadron logger=wandb 
# ================================================================================================== 

# Default configuration sources
defaults:
  - override /datamodule: herwig_event_multihadron.yaml
  - override /model: multihadron_event_gan.yaml

# Hydra logs
task_name: herwigMultiHadronEvents
tags: ["herwig", "MultiHadronEvents"]

# Training and testing invocation
train: True
test: False

datamodule:
  batch_size: 256

# Logger
logger:
  wandb:
#     # Specify the name of your W&B project and team
    entity: "rd804"
    project: "hadml"
    tags: ["herwig", "MultiHadronEvents", "rambo"]
    group: "multihadron_test"
    job_type: "1M_test"
    name: "fixed_masses"

# Trainer
trainer:
  max_epochs: 1000

  #datamodule:

  #enable_progress_bar: false
  # Sanity check and validation frequency
  num_sanity_val_steps: -1
  check_val_every_n_epoch: 1
  
  # Configuration for multiple GPUs (DDP strategy)
  accelerator: gpu
  devices: [2]

  # devices: [0,1,2]
  # accelerator: gpu
  # strategy: ddp
  # # If you have a small training data set, set the below line to 1
  # log_every_n_steps: 1

#callbacks:
 # - class_path: pytorch_lightning.callbacks.progress.TQDMProgressBar
model:
  noise_dim : 32
  loss_type : "bce"
  r1_reg : 1.0
  target_gumbel_temp : 0.4
  violation_loss_coeff : 0.1
  non_pad_loss_coeff: 0.5
  entropy_coeff : 0.3
  # is_odd_loss : 0.0

  gumbel_softmax_hard : True

  optimizer_generator:
    lr : 1e-3
  optimizer_discriminator:
    lr : 1e-4


  generator:
    dim_feedforward : 256
    n_heads : 4
    num_layers : 4

  discriminator:
    dim_feedforward : 256
    n_heads : 4
    num_layers : 2
  

